<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account | SP FoodExpress</title><link rel="stylesheet" href="css/style.css"></head>
<body><div class="auth-page"><div class="auth-box"><a class="logo auth-logo" href="index.html"><span class="logo-mark">SP</span> FoodExpress</a><h1>Create your account</h1><p class="muted">Save favourites, order faster and manage your meals.</p><form id="registerForm"><div class="form-grid"><div class="form-group"><label>Full Name</label><input class="input" id="name" required></div><div class="form-group"><label>Phone</label><input class="input" id="phone" required></div><div class="form-group full"><label>Email</label><input class="input" type="email" id="email" required></div><div class="form-group full"><label>Password</label><input class="input" type="password" id="password" minlength="6" required></div><div class="form-group full"><label>Address</label><textarea class="textarea" id="address" placeholder="Your delivery address"></textarea></div></div><button class="btn btn-primary">Create Account</button></form><p class="muted">Already registered? <a style="color:var(--blue);font-weight:800" href="login.html">Login</a></p></div></div><div class="toast"></div><script src="js/data.js"></script><script src="js/app.js"></script></body></html>
